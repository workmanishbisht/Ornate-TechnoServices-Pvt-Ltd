<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link

    />

      rel="stylesheet"

    <link rel="stylesheet" href="style.css" />

  <body>
    <main>
      <!-- TOP BAR -->
      <div class="top-bar">
        <div class="container top-content">
          <div class="left">
            <span><i class="ri-mail-line"></i> info@ornatets.com</span>
            <span
              ><i class="ri-map-pin-line"></i> H 34, Sector 63, Noida -
              201301</span
            >
          </div>
          <div class="right">
            <span><i class="ri-phone-line"></i> 0120 - 4484 - 666</span>
          </div>
        </div>
      </div>

      <!-- NAVBAR -->
      <header class="navbar">
        <div class="container nav-content">
          <div class="logo">
            <img src="./image/logo/ornate-logo.png" alt="logo" />
          </div>

          <ul class="nav-links">
            <li><a href="#" class="active">Home</a></li>
            <li><a href="#">Who We Are</a></li>
            <li>

            <li><a href="#">Careers</a></li>
            <li><a href="#">SAP</a></li>
            <li><a href="#">Contact Us</a></li>

          <div class="cta">
            <button>Get A Free Quote</button>
          </div>
        </div>
      </header>

      <!-- home section -->
      <section class="home" id="home">
        <div class="swiper homeSwiper">
          <div class="swiper-wrapper"></div>
          <div class="swiper-button-prev"></div>
          <div class="swiper-button-next"></div>
          <div class="swiper-pagination"></div>
        </div>
      </section>
    </main>

    <!-- script file -->
    <script src="./script.js"></script>
